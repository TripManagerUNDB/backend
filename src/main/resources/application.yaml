spring:
  application:
    name: TripManagerUNDB

  main:
    allow-circular-references: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/tripmanager

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:trip-manager-secret-key-muito-longa-para-hs256-minimo-256-bits-ok}
    expiration-ms: 86400000  
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  python-api:
    url: ${PYTHON_API_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
