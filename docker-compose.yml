services:
  backend:
    build: .
    container_name: tripmanager-backend
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/tripmanager

  mongodb:
    image: mongo:7
    container_name: tripmanager-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
