services:
  backend:
    build: .
    container_name: tripmanager-backend
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/tripmanager
      JWT_SECRET: trip-manager-secret-key-muito-longa-para-hs256-minimo-256-bits-ok
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001

  mongodb:
    image: mongo:7
    container_name: tripmanager-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
